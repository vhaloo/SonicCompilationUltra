name: Build and validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            deployment: '10.15'
          - os: macos-15
            platform: macos
            arch: arm64
            deployment: '11.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test update selection, installation and recovery
        run: cargo test --locked --manifest-path updater/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux display/audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
      - name: Configure Unix
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}
      - name: Build
        run: cmake --build build --config Release --parallel 3 --target SonicCompilationUltra scu_tests scu_runtime_tests scu_ui_tests scu_gl_tests
      - name: Render original voxel scene in Linux OpenGL
        if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/scu_gl_tests
      - name: Render original voxel scene in macOS OpenGL
        if: runner.os == 'macOS'
        run: ./build/scu_gl_tests
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: ROM-free UI validation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/smoke_ui.py --build build
      - name: Package software and corresponding source
        run: python tools/package.py --build build --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --out dist --source
      - name: Validate the portable package
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: python
        run: |
          import pathlib, subprocess, sys
          packages = [p for p in pathlib.Path('dist').glob('SonicCompilationUltra-*-${{ matrix.platform }}-${{ matrix.arch }}') if p.is_dir()]
          assert len(packages) == 1, packages
          subprocess.run([sys.executable, 'tools/smoke_ui.py', '--build', 'build', '--package', str(packages[0])], check=True)
      - name: Verify updater against the actual release archive
        shell: python
        run: |
          import os, pathlib, subprocess
          suffix = '.zip' if '${{ matrix.platform }}' == 'windows' else '.tar.gz'
          package, = pathlib.Path('dist').glob('SonicCompilationUltra-*-${{ matrix.platform }}-${{ matrix.arch }}' + suffix)
          subprocess.run(['cargo', 'test', '--locked', '--manifest-path', 'updater/Cargo.toml',
                          'matches_real_release_package_when_supplied'],
                         env=dict(os.environ, SCU_TEST_RELEASE_PACKAGE=str(package.resolve())), check=True)
      - name: Upload packages and validation
        uses: actions/upload-artifact@v4
        with:
          name: SCU-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            build/ui-smoke/report.json
            build/package-smoke/report.json
          if-no-files-found: error
