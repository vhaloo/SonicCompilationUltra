name: XR companion desktop compile only
on:
  push:
    branches: [quest-standalone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            deployment: '10.15'
          - os: macos-15
            platform: macos
            arch: arm64
            deployment: '11.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Audit source
        run: |
          python tools/audit_public.py
          python tools/audit_xr_development.py
          python tools/audit_mobile_development.py
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}
      - name: Compile without starting the application
        run: cmake --build build --config Release --parallel 3 --target SonicCompilationUltra
      - name: Pure spatial checks without SDL or a game
        run: |
          cmake -S tests/spatial -B build-spatial
          cmake --build build-spatial --config Release
          ctest --test-dir build-spatial -C Release --output-on-failure
          cmake -S tests/touch -B build-touch
          cmake --build build-touch --config Release
          ctest --test-dir build-touch -C Release --output-on-failure
      - name: Package ROM-free software
        run: python tools/package.py --build build --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --out dist --source
      - uses: actions/upload-artifact@v4
        with:
          name: XR-companion-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
